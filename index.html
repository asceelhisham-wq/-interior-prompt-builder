<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interior Prompt Builder</title>
  <meta name="description" content="Pick a room, a style, and pieces — get a ready-to-use AI image prompt.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">Room<span class="mark">prompt</span></span>
      <span class="tag">Build an AI render prompt from a room, a style, and a few pieces.</span>
    </div>
    <span class="spacer"></span>
    <button class="btn btn-ghost mobile-tabs" id="openLeft" type="button">Rooms &amp; style</button>
    <button class="btn btn-ghost mobile-tabs" id="openRight" type="button">Selection</button>
    <button class="btn btn-ghost" id="randomizeBtn" type="button" title="Pick a random style and matching pieces">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/><circle cx="16" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="16" r="1.4" fill="currentColor"/></svg>
      Surprise me
    </button>
    <button class="btn btn-ghost" id="resetBtn" type="button">Reset</button>
  </header>

  <div class="scrim" id="scrim"></div>

  <main class="app">
    <!-- Panel 1: Room & Style -->
    <aside class="col col-left" id="colLeft">
      <div class="col-scroll">
        <section>
          <div class="panel-title">Room</div>
          <div class="room-grid" id="roomGrid"></div>
        </section>

        <section>
          <div class="panel-title">Style <span class="hint" id="styleHint">30 to choose from</span></div>
          <div class="style-list" id="styleList"></div>
        </section>

        <section>
          <div class="field">
            <label for="paletteTitle">Colour palette</label>
            <div class="palette-opts" id="paletteOpts" aria-label="Colour palette"></div>
          </div>
          <div class="field">
            <label>Lighting mood</label>
            <div class="mood-grid" id="moodGrid"></div>
          </div>
        </section>
      </div>
    </aside>

    <!-- Panel 2: Item Library -->
    <section class="col col-center">
      <div class="lib-head">
        <div class="lib-controls">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="search" placeholder="Search 100 pieces — sofa, plaster, olive tree…" aria-label="Search items">
          </div>
          <button class="toggle-all" id="showAll" type="button" aria-pressed="false">Show all rooms</button>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="lib-body" id="libBody"></div>
    </section>

    <!-- Panels 3 & 4: Selection, Preview, Prompt -->
    <aside class="col col-right" id="colRight">
      <div class="col-scroll">
        <section>
          <div class="sel-head">
            <div class="panel-title" style="margin:0">Your selection</div>
            <span class="sel-count" id="selCount"></span>
          </div>
          <div id="warnSlot"></div>
          <div class="sel-list" id="selList"></div>
        </section>

        <section>
          <div class="panel-title">Preview</div>
          <div class="preview" id="preview"></div>
        </section>

        <section>
          <div class="panel-title">Generated prompt</div>
          <div class="prompt-box">
            <div class="prompt-text" id="promptText"></div>
            <div class="prompt-actions">
              <button class="btn btn-accent" id="copyBtn" type="button">Copy prompt</button>
            </div>
          </div>
        </section>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
